<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HANDSLAGET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12122B;
  --panel:#1E1E3F;
  --line:#8C8CD0;
  --text:#E8E8FF;
  --cyan:#5CE0E0;
  --gold:#D4A94E;
  --green:#5CD47F;
  --skin:#D9A078;
  --skin-d:#A9724F;
  --robe:#7A4FA9;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:VT323,"Courier New",monospace;
  font-size:21px;
  line-height:1.35;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  overflow-x:hidden;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);
  z-index:50;
}
.app{
  width:100%;
  max-width:440px;
  min-height:100vh;
  min-height:100svh;
  padding:14px 14px calc(14px + max(env(safe-area-inset-bottom),10px));
  display:flex;
  flex-direction:column;
  gap:12px;
}
svg{shape-rendering:crispEdges;display:block}

/* status */
.hud{
  flex:none;
  border:3px solid var(--line);
  padding:8px 10px;
  display:flex;
  flex-direction:column;
  gap:7px;
}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lbl{font-size:19px;color:var(--line);letter-spacing:1px}
.pips{display:flex;gap:5px;margin-left:auto}
.pip{width:13px;height:13px;background:var(--gold)}
.pip.spent{background:transparent;box-shadow:inset 0 0 0 3px #3A3A66}
.lang{display:inline-flex;flex:none}
.lang button{
  font:inherit;font-size:16px;letter-spacing:1px;line-height:1;
  background:transparent;color:var(--line);
  border:2px solid #3A3A66;
  padding:4px 7px;cursor:pointer;
}
.lang button+button{border-left-width:0}
.lang button.on{background:var(--line);color:var(--bg);border-color:var(--line)}
.lang button:hover:not(:disabled):not(.on){color:var(--cyan);border-color:var(--cyan)}
.lang button:disabled{opacity:.4;cursor:default}
.lang button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.footrow{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:5px}
.slots{display:flex;gap:6px}
.slot{
  flex:1;
  border:3px solid #3A3A66;
  padding:5px 2px;
  text-align:center;
  font-size:18px;
  color:#6E6EA8;
  letter-spacing:.5px;
}
.slot.ok{border-color:var(--green);color:var(--green);background:rgba(92,212,127,.1)}

/* scene */
.scene{
  flex:1 1 auto;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:10px;
  padding-top:4px;
}
.king{width:clamp(92px,26vh,132px)}
.king.alone{opacity:.45;filter:grayscale(.8)}
.bubble{
  position:relative;
  border:3px solid var(--text);
  background:#000;
  padding:12px 13px;
  width:100%;
  min-height:98px;
  font-size:23px;
  line-height:1.3;
}
.bubble::before,.bubble::after{
  content:"";position:absolute;background:var(--text);
}
.bubble::before{width:14px;height:3px;top:-3px;left:50%;margin-left:-22px;background:#000}
.bubble::after{
  width:14px;height:11px;top:-14px;left:50%;margin-left:-22px;
  background:#000;
  border-left:3px solid var(--text);
  border-right:3px solid var(--text);
  transform:skewX(-20deg);
}
.bubble b{font-weight:400;color:var(--cyan)}
.cursor{display:inline-block;width:11px;height:19px;background:var(--text);vertical-align:-2px;animation:blink .9s steps(1,end) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* arena */
.arena{
  position:relative;
  width:100%;
  height:clamp(108px,20vh,146px);
  flex:none;
  overflow:hidden;
}
.pair{position:absolute;left:0;right:0;top:4px;height:82px}
.hand{
  position:absolute;
  width:104px;
  transition:transform .42s steps(7,end);
}
.hand.you{left:50%;margin-left:-100px;transform:translateX(-100vw)}
.hand.king{left:50%;margin-left:-4px;transform:translateX(100vw) scaleX(-1)}
.reach .hand.you,.withdraw .hand.you,.clasp .hand.you{transform:translateX(0)}
.reach .hand.king{transform:translateX(0) scaleX(-1)}
.withdraw .hand.king{transform:translateX(100vw) scaleX(-1)}
.clasped{
  position:absolute;left:50%;top:4px;width:168px;margin-left:-84px;
  display:none;
}
.clasp .clasped{display:block;animation:shake .85s steps(1,end) 1}
.clasp .hand{display:none}
@keyframes shake{
  0%{transform:translateY(0)}
  13%{transform:translateY(9px)}
  26%{transform:translateY(-7px)}
  39%{transform:translateY(8px)}
  52%{transform:translateY(-6px)}
  65%{transform:translateY(6px)}
  80%{transform:translateY(-4px)}
  100%{transform:translateY(0)}
}
.hand.wag svg{animation:wag .9s steps(1,end) 2;transform-origin:50% 90%}
@keyframes wag{
  0%{transform:rotate(0deg)}
  25%{transform:rotate(14deg)}
  50%{transform:rotate(0deg)}
  75%{transform:rotate(-14deg)}
  100%{transform:rotate(0deg)}
}
.flash{
  position:absolute;inset:0;background:var(--green);opacity:0;pointer-events:none;
}
.clasp .flash{animation:flash .5s steps(2,end) 1}
@keyframes flash{0%{opacity:.5}50%{opacity:0}75%{opacity:.3}100%{opacity:0}}
.verdict{
  position:absolute;left:0;right:0;bottom:0;text-align:center;
  font-size:21px;line-height:1.15;letter-spacing:1px;color:var(--line);
}
.verdict.ok{color:var(--green)}

/* choices */
.choices{flex:none;display:flex;flex-direction:column;gap:7px}
.choice{
  font:inherit;font-size:21px;letter-spacing:1px;
  background:var(--panel);color:var(--text);
  border:3px solid var(--line);
  padding:9px 11px;
  display:flex;align-items:center;gap:11px;
  cursor:pointer;text-align:left;width:100%;
}
.choice svg{width:40px;flex:none}
.choice:hover:not(:disabled){background:#2C2C5C;border-color:var(--cyan)}
.choice:active:not(:disabled){transform:translate(2px,2px)}
.choice:disabled{opacity:.35;cursor:default}
.choice:focus-visible,.cta:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

/* endings */
.title{font-family:"Press Start 2P",VT323,monospace;font-size:19px;line-height:1.6;text-align:center}
.end{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.end p{font-size:22px;max-width:22em}
.dim{color:var(--line)}
.cta{
  font:inherit;font-size:21px;letter-spacing:1px;
  background:var(--text);color:var(--bg);border:3px solid var(--text);
  padding:10px;width:100%;cursor:pointer;
}
.cta.alt{background:transparent;color:var(--text);border-color:var(--line)}
.foot{flex:none;border-top:3px solid #3A3A66;padding-top:9px;text-align:center;font-size:19px;color:var(--line)}
.foot a{color:var(--text)}
.actions{flex:none;display:flex;flex-direction:column;gap:7px}
/* Short viewports: phone with browser bars, split screen, landscape-ish.
   Scale the board down so the choices stay on screen instead of under an overlay. */
@media (max-width:365px){
  .lang button{font-size:14px;padding:3px 5px;letter-spacing:0}
  .slot{font-size:15px;padding:5px 1px;letter-spacing:0}
  .slots{gap:4px}
  .lbl{font-size:17px}
}
@media (max-height:740px){
  body{font-size:19px}
  .app{gap:9px}
  .scene{gap:8px}
  .king{width:clamp(80px,19vh,108px)}
  .bubble{min-height:78px;font-size:21px;padding:10px 11px}
  .arena{height:clamp(94px,17vh,122px)}
  .hand{width:88px}
  .hand.you{margin-left:-85px}
  .clasped{width:142px;margin-left:-71px}
  .choice{padding:7px 10px;font-size:20px;gap:9px}
  .choice svg{width:34px}
  .lbl,.slot,.verdict{font-size:17px}
  .pip{width:11px;height:11px}
  .lang button{font-size:15px;padding:3px 6px}
  .footrow{gap:10px;margin-top:4px}
  .end{gap:11px}
  .title{font-size:17px;line-height:1.5}
  .end p{font-size:20px}
  .cta{padding:8px;font-size:20px}
  .foot{font-size:17px;padding-top:7px}
}
@media (max-height:620px){
  .king{width:clamp(66px,15vh,88px)}
  .bubble{min-height:64px;font-size:19px}
  .arena{height:clamp(84px,15vh,104px)}
  .hand{width:76px}
  .hand.you{margin-left:-74px}
  .clasped{width:122px;margin-left:-61px}
  .choice{padding:5px 9px;font-size:19px}
  .choice svg{width:28px}
  .lang button{font-size:14px;padding:2px 5px}
  .end{gap:8px}
  .title{font-size:15px}
  .end p{font-size:18px}
  .cta{padding:6px;font-size:19px}
  .foot{font-size:16px;padding-top:6px}
}
@media (max-height:520px){
  .app{gap:5px;padding-top:8px}
  .hud{padding:4px 8px;gap:4px}
  .scene{gap:5px}
  .king{width:clamp(52px,12vh,70px)}
  .bubble{min-height:44px;font-size:18px;padding:7px 9px}
  .arena{height:clamp(66px,13vh,80px)}
  .hand{width:62px}
  .hand.you{margin-left:-60px}
  .clasped{width:100px;margin-left:-50px}
  .choice{padding:4px 8px;font-size:18px}
  .choice svg{width:24px}
  .lang button{font-size:13px;padding:2px 4px}
  .lbl,.slot,.verdict{font-size:16px}
  .end{gap:6px}
  .title{font-size:13px}
  .end p{font-size:16px}
  .cta{padding:5px;font-size:18px}
  .foot{font-size:15px;padding-top:5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
/* Länk till Unionens sida om konflikten. Byt till rätt URL före lansering. */
var UNIONEN_URL = "https://www.unionen.se/aktuellt/unionen-varslar-om-strejk-pa-king";

/* ---- pixel sprites ---- */
function sprite(rows, pal, w){
  var h = rows.length, out = '<svg viewBox="0 0 ' + w + ' ' + h + '">';
  for (var y=0; y<h; y++){
    for (var x=0; x<w; x++){
      var c = rows[y][x];
      if (c && c !== "." && pal[c]) out += '<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+pal[c]+'"/>';
    }
  }
  return out + "</svg>";
}

var KING = sprite([

/* öppen hand från sidan, riktad åt höger */

"....HHHHHHHHHHHHHHHHH...",

];
/* två händer i grepp */
var CLASP = [
"....................................",
"..............sHHHH.................",
".............HHHHHHs................",
"..........HHHHHHHHHHHH..............",
".....HHHHHHHHHHHHHHHHHHHHHH.........",
"....HHHHHHHHHHHHHHHHHHHHHHHHHHH.....",
"bbbbHHHHHHHHHHHHHHHHHHHHHHHHHHHHpppp",
"bbbbHHHHHHHHHHHHHHssssssHHHHHHHHpppp",
"bbbbHHHHHHHHHHHHHHHHHHHHHHHHHHHHpppp",
"bbbbHHHHHHHHHHHHHHssssssHHHHHHHHpppp",
"bbbbHHHHHHHHHHHHHHHHHHHHHHHHHHHHpppp",
"bbbbHHHHHHHHHHHHHHssssssHHHHHHHHpppp",
"bbbbHHHHHHHHHHHHHHHHHHHHHHHHHHHHpppp",
"....HHHHHHHHHHHHHHHHHHHHHHHHHHH.....",
".....HHHHHHHHHHHHHHHHHHHHHHHHH......",
"........HHHHHHHHHHHHHHHHHHH.........",
"...................................."
];
/* icke sa nicke */
var NOPE = [

"......HsH.......",
"......HHH.......",
"......HHH.......",
"......HHH.......",
".....HHHHH......",
"...HHHHHHHH.....",
"..HHHHHHHHHH....",
"..HHssssHHHH....",
"..HHHHHHHHHH....",
"..HHssssHHHH....",
"..HHHHHHHHHH....",
"..HHssssHHHH....",
"..HHHHHHHHHH....",
"...HHHHHHHH.....",
"...pppppppp.....",
"...pppppppp.....",
"................"
];
var SKIN = {H:"#D9A078",s:"#A9724F"};
function pal(extra){ var p={H:SKIN.H,s:SKIN.s}; for (var k in extra) p[k]=extra[k]; return p; }

var HAND_YOU  = sprite(HAND_OPEN, pal({b:"#3B7AC4"}), 24);
var HAND_KING = sprite(HAND_OPEN, pal({b:"#7A4FA9"}), 24);
var HAND_ICON = sprite(HAND_OPEN, pal({b:"#8C8CD0"}), 24);
var CLASP_S   = sprite(CLASP, pal({b:"#3B7AC4",p:"#7A4FA9"}), 36);
var NOPE_S    = sprite(NOPE, pal({p:"#7A4FA9"}), 16);

/* ---- content ---- */
var ORDER = ["trygghet","inflytande","villkor"];

/* Every user-facing string, per language. Topic keys stay the same in both so the
   game logic never has to care which language is showing; only the copy swaps.
   Each topic must keep the same number of lines in both languages, because the
   current line is tracked by index so switching language mid-game keeps your place. */
var STR = {
  en:{
    tries:"TRIES LEFT",
    hint:"PICK WHAT THE KING IS TALKING ABOUT.",
    shake:"HANDSHAKE. YOU AGREED ON $.",
    miss:"THE KING TALKED ABOUT $. ONE TRY GONE.",
    dealTitle:"WE HAVE AN AGREEMENT",
    dealLead:"The king is happy. The employees are happy.",
    dealBody:"A collective agreement takes nothing from anyone. It sets a floor, not a ceiling, and gives both sides the same rules to work by.",
    strikeTitle:"STRIKE",
    strikeLead:"We are still here. The hand is still held out.",
    strikeBody:"We wanted to meet. It did not happen this time. We are putting down our work until we can build this together.",
    again:"PLAY AGAIN",
    share:"SHARE",
    copied:"LINK COPIED",
    footLink:"Read about the conflict at King",
    footOrg:"Unionen",
    shareText:"We want a say in our workplace.",
    topics:{
      trygghet:{label:"SECURITY", lines:[
        ["Nobody here needs to worry about their ","job","."],
        ["Your ","pension"," is sorted, nobody needs to worry about that."],
        ["We have ","insurance"," that covers most of it."]
      ]},
      inflytande:{label:"INFLUENCE", lines:[
        ["My ","door is always open","."],
        ["We ","listen"," to our people, all the time."],
        ["Everyone gets to ","speak up"," at the Tuesday meeting."]
      ]},
      villkor:{label:"TERMS", lines:[
        ["We pay above ","market rate","."],
        ["Look at the ","benefits package",". It is generous."],
        ["We are above the ","industry average"," on most things."]
      ]}
    }
  },
  sv:{
    tries:"F\u00d6RS\u00d6K KVAR",
    hint:"V\u00c4LJ DET KUNGEN PRATAR OM.",
    shake:"HANDSLAG. NI ENADES OM $.",
    miss:"KUNGEN PRATADE OM $. ETT F\u00d6RS\u00d6K BORTA.",
    dealTitle:"VI HAR ETT AVTAL",
    dealLead:"Kungen \u00e4r n\u00f6jd. De anst\u00e4llda \u00e4r n\u00f6jda.",
    dealBody:"Ett kollektivavtal tar ingenting fr\u00e5n n\u00e5gon. Det s\u00e4tter ett golv, inte ett tak, och ger b\u00e5da sidor samma spelregler att jobba efter.",
    strikeTitle:"STREJK",
    strikeLead:"Vi \u00e4r kvar. Handen \u00e4r fortfarande utstr\u00e4ckt.",
    strikeBody:"Vi ville m\u00f6tas. Det gick inte den h\u00e4r g\u00e5ngen. Vi l\u00e4gger ner arbetet tills vi kan bygga det h\u00e4r tillsammans.",
    again:"SPELA IGEN",
    share:"DELA",
    copied:"L\u00c4NK KOPIERAD",
    footLink:"L\u00e4s om konflikten p\u00e5 King",
    footOrg:"Unionen",
    shareText:"Vi vill vara med och p\u00e5verka.",
    topics:{
      trygghet:{label:"TRYGGHET", lines:[
        ["Ingen h\u00e4r beh\u00f6ver oroa sig f\u00f6r sin ","anst\u00e4llning","."],
        ["","Pensionen"," \u00e4r ordnad, det beh\u00f6ver ingen oroa sig f\u00f6r."],
        ["Vi har ","f\u00f6rs\u00e4kringar"," som t\u00e4cker det mesta."]
      ]},
      inflytande:{label:"INFLYTANDE", lines:[
        ["Min ","d\u00f6rr st\u00e5r alltid \u00f6ppen","."],
        ["Vi ","lyssnar"," p\u00e5 v\u00e5ra medarbetare, hela tiden."],
        ["Alla f\u00e5r ","s\u00e4ga sitt"," p\u00e5 tisdagsm\u00f6tet."]
      ]},
      villkor:{label:"VILLKOR", lines:[
        ["Vi betalar \u00f6ver ","marknadsl\u00f6n","."],
        ["Se p\u00e5 ","f\u00f6rm\u00e5nspaketet",". Det \u00e4r gener\u00f6st."],
        ["Vi ligger \u00f6ver ","branschsnittet"," p\u00e5 det mesta."]
      ]}
    }
  }
};

/* ---- language ---- */
var LANG = "en";
var LANG_KEY = "handslaget.lang";
function T(){ return STR[LANG]; }
function TOP(t){ return T().topics[t]; }
function fill(str, v){ return str.replace("$", v); }

function initLang(){
  var stored = null;
  try { stored = localStorage.getItem(LANG_KEY); } catch(e){}
  LANG = (stored === "sv" || stored === "en") ? stored : "en";
  document.documentElement.lang = LANG;
}
function setLang(l){
  if (l === LANG || S.resolving) return;
  LANG = l;
  document.documentElement.lang = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e){}
  render();
}
function langHtml(){
  return '<span class="lang" role="group" aria-label="Language">'
    + '<button type="button" data-l="en"' + (LANG === "en" ? ' class="on" aria-pressed="true"' : ' aria-pressed="false"') + '>EN</button>'
    + '<button type="button" data-l="sv"' + (LANG === "sv" ? ' class="on" aria-pressed="true"' : ' aria-pressed="false"') + '>SE</button>'
    + '</span>';
}
function bindLang(root){
  Array.prototype.forEach.call(root.querySelectorAll(".lang button"), function(b){
    b.onclick = function(){ setLang(b.dataset.l); };
  });
}

/* ---- state ---- */
var S, typer;
function reset(){
  S = {agreed:[],tries:4,current:null,busy:true,taught:false,screen:"play",resolving:false};
  nextLine();
}
function remaining(){ return ORDER.filter(function(t){return S.agreed.indexOf(t)<0;}); }
function nextLine(){
  var pool = remaining();
  var t = pool[Math.floor(Math.random()*pool.length)];
  /* store the line INDEX, not the text, so a language switch keeps the same line */
  S.current = {topic:t, li:Math.floor(Math.random()*TOP(t).lines.length)};
}
function curLine(){ return TOP(S.current.topic).lines[S.current.li]; }

/* ---- typewriter ---- */
function type(el, parts, done){
  var full = parts[0] + parts[1] + parts[2];
  var kStart = parts[0].length, kEnd = kStart + parts[1].length;
  var i = 0;
  clearInterval(typer);
  function paint(){
    var a = full.slice(0, Math.min(i,kStart));
    var b = full.slice(Math.min(i,kStart), Math.min(i,kEnd));
    var c = full.slice(Math.min(i,kEnd), i);
    el.innerHTML = a + "<b>" + b + "</b>" + c + '<span class="cursor"></span>';
  }
  typer = setInterval(function(){
    i++;
    paint();
    if (i >= full.length){ clearInterval(typer); done && done(); }
  }, 26);
  paint();
  el.onclick = function(){ clearInterval(typer); i = full.length; paint(); done && done(); };
}

/* ---- flow ---- */
function choose(topic){
  if (S.busy) return;
  S.busy = true;
  var match = topic === S.current.topic;
  var arena = document.getElementById("arena");
  var verdict = document.getElementById("verdict");
  S.resolving = true;
  setButtons(false);
  setLangButtons(false);
  arena.className = "arena reach";

  setTimeout(function(){
    if (match){
      arena.className = "arena reach clasp";
      verdict.className = "verdict ok";
      verdict.textContent = fill(T().shake, TOP(S.current.topic).label);
      S.agreed.push(S.current.topic);
    } else {
      var kh = document.getElementById("kinghand");
      kh.innerHTML = NOPE_S;
      kh.classList.add("wag");
      verdict.className = "verdict";
      verdict.textContent = fill(T().miss, TOP(S.current.topic).label);
      S.tries--;
      setTimeout(function(){ arena.className = "arena withdraw"; }, 1150);
    }
    paintHud();
    setTimeout(function(){
      if (S.agreed.length === 3){ S.screen = "deal"; render(); return; }
      if (S.tries === 0){ S.screen = "strike"; render(); return; }
      nextLine();
      render();
    }, match ? 1600 : 2000);
  }, 520);
}

function setButtons(on){
  Array.prototype.forEach.call(document.querySelectorAll(".choice"), function(b){ b.disabled = !on; });
}
function setLangButtons(on){
  Array.prototype.forEach.call(document.querySelectorAll(".lang button"), function(b){ b.disabled = !on; });
}
function paintHud(){
  var pips = document.getElementById("pips");
  if (pips){
    pips.innerHTML = "";
    for (var i=0;i<4;i++){
      var d = document.createElement("span");
      d.className = "pip" + (i < S.tries ? "" : " spent");
      pips.appendChild(d);
    }
  }
  var slots = document.getElementById("slots");
  if (slots){
    slots.innerHTML = ORDER.map(function(t){
      var ok = S.agreed.indexOf(t) >= 0;
      return '<div class="slot' + (ok?" ok":"") + '">' + (ok ? "&#10003; " : "") + TOP(t).label + "</div>";
    }).join("");
  }
}

function render(){
  var app = document.getElementById("app");
  S.resolving = false;

  if (S.screen === "deal" || S.screen === "strike"){
    var deal = S.screen === "deal";
    app.innerHTML =
      '<div class="end">'
      + '<div class="king' + (deal ? '' : ' alone') + '">' + KING + '</div>'
      + '<h1 class="title">' + (deal ? T().dealTitle : T().strikeTitle) + '</h1>'
      + '<p>' + (deal ? T().dealLead : T().strikeLead) + '</p>'
      + '<p class="dim">' + (deal ? T().dealBody : T().strikeBody) + '</p>'
      + '</div>'
      + '<div class="actions">'
        + '<button class="cta" id="again">' + T().again + '</button>'
        + '<button class="cta alt" id="share">' + T().share + '</button>'
      + '</div>'
      + '<div class="foot">'
        + '<a href="' + UNIONEN_URL + '" target="_blank" rel="noopener">' + T().footLink + '</a>'
        + '<div class="footrow"><span>' + T().footOrg + '</span>' + langHtml() + '</div>'
      + '</div>';
    document.getElementById("again").onclick = function(){ reset(); render(); };
    document.getElementById("share").onclick = share;
    bindLang(app);
    return;
  }

  app.innerHTML =
    '<div class="hud">'
      + '<div class="row"><span class="lbl">' + T().tries + '</span><span class="pips" id="pips"></span>' + langHtml() + '</div>'
      + '<div class="slots" id="slots"></div>'
    + '</div>'
    + '<div class="scene">'
      + '<div class="king">' + KING + '</div>'
      + '<div class="bubble" id="bubble"></div>'
      + '<div class="arena" id="arena">'
        + '<div class="pair">'
          + '<div class="hand you">' + HAND_YOU + '</div>'
          + '<div class="hand king" id="kinghand">' + HAND_KING + '</div>'
          + '<div class="clasped">' + CLASP_S + '</div>'
        + '</div>'
        + '<div class="flash"></div>'
        + '<div class="verdict" id="verdict"></div>'
      + '</div>'
    + '</div>'
    + '<div class="choices">'
      + remaining().map(function(t){
          return '<button class="choice" data-t="'+t+'" disabled>' + HAND_ICON + TOP(t).label + '</button>';
        }).join("")
    + '</div>';

  paintHud();
  bindLang(app);
  Array.prototype.forEach.call(app.querySelectorAll(".choice"), function(b){
    b.onclick = function(){ choose(b.dataset.t); };
  });

  type(document.getElementById("bubble"), curLine(), function(){
    S.busy = false;
    setButtons(true);
    if (!S.taught){
      S.taught = true;
      document.getElementById("verdict").textContent = T().hint;
    }
  });
}

function share(){
  var data = {title:"HANDSLAGET", text:T().shareText, url:location.href};
  if (navigator.share){ navigator.share(data).catch(function(){}); return; }
  if (navigator.clipboard){
    navigator.clipboard.writeText(location.href);
    var b = document.getElementById("share");
    b.textContent = T().copied;
    setTimeout(function(){ b.textContent = T().share; }, 1800);
  }
}

initLang();
reset();
render();
</script>
</body>
</html>
